name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys to the same environment at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Worker boots under Miniflare during `astro preview`; provide
      # throwaway local secrets (nothing is committed). The local D1 is empty so
      # nothing encrypted is ever decrypted with the EmDash key. ADMIN_PASSWORD
      # enables the /admin area so admin.spec.ts actually runs instead of
      # skipping — it is a disposable CI value, NOT the production secret.
      #
      # The Turnstile pair is Cloudflare's PUBLISHED always-passes test pair,
      # not this site's. Overriding the real site key from wrangler.jsonc is
      # the point: a real widget would sit there unsolved in front of a
      # headless browser, the submit gate would never open, and every
      # submission spec would time out against a form the visitor can
      # actually use. The test pair keeps the whole path — widget renders,
      # token issued, endpoint verifies — instead of switching it off.
      - name: Provide local secrets for the preview Worker
        run: |
          {
            echo "EMDASH_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=ci-test-password"
            echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
          } > .dev.vars

      # Chromium AND WebKit. e2e/design.spec.ts runs in both: most of this
      # site's visitors are on Safari, or on iOS where every browser is
      # WebKit, and that is where a Chromium-only suite misses a layout
      # break — `overflow:clip`, `100svh`/`100dvh`, `:has()`,
      # `@starting-style` and the Popover API all diverge across engines and
      # this design uses every one of them. It has already caught a real bug
      # Chromium did not report.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # `pnpm test:e2e` builds the Worker and runs it via `astro preview`
      # (local D1 + R2), then drives the recruit form end to end.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"

      # The email-dashboard suite builds + previews the admin Worker
      # (ADMIN_STANDALONE) on its own port and drives the dashboard at /mail. No
      # AWS SES secrets are provided, so no test can dispatch a real email.
      # Reuses the same .dev.vars.
      - name: Run mail (email dashboard) E2E tests
        run: pnpm test:e2e:mail
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    # Only deploy from main, and only after CI + E2E pass.
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # wrangler reads these from the environment. The Worker runtime secrets
    # (ADMIN_PASSWORD, AWS_*, EMDASH_ENCRYPTION_KEY) are set once with
    # `wrangler secret put` and persist across deploys — the pipeline never
    # touches them.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This codebase runs as THREE Workers off different wrangler configs,
      # sharing the same D1 + R2. Each script sets WRANGLER_CONFIG so both the
      # astro build and `wrangler deploy` target the matching config. Deploy all
      # three so a push to main updates the whole surface, not just the main site.
      # The `admin` Worker now also hosts email (dashboard at /mail, the SES send
      # + campaign cron, and the SNS webhook) — the standalone notify Worker was
      # retired.
      - name: Deploy main site (curevanails)
        run: pnpm deploy

      - name: Deploy getready waitlist Worker
        run: pnpm deploy:getready

      - name: Deploy admin console + email Worker
        run: pnpm deploy:admin
