name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deploys to the same environment at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Worker boots under Miniflare during `astro preview`; provide
      # throwaway local secrets (nothing is committed). The local D1 is empty so
      # nothing encrypted is ever decrypted with the EmDash key. ADMIN_PASSWORD
      # enables the /admin area so admin.spec.ts actually runs instead of
      # skipping — it is a disposable CI value, NOT the production secret.
      - name: Provide local secrets for the preview Worker
        run: |
          {
            echo "EMDASH_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=ci-test-password"
          } > .dev.vars

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm test:e2e` builds the Worker and runs it via `astro preview`
      # (local D1 + R2), then drives the recruit form end to end.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"

      # The notify Worker suite builds + previews the notify config
      # (NOTIFY_STANDALONE) on its own port. No AWS SES secrets are provided, so
      # no test can dispatch a real email. Reuses the same .dev.vars.
      - name: Run notify E2E tests
        run: pnpm test:e2e:notify
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    # Only deploy from main, and only after CI + E2E pass.
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # wrangler reads these from the environment. The Worker runtime secrets
    # (ADMIN_PASSWORD, AWS_*, EMDASH_ENCRYPTION_KEY) are set once with
    # `wrangler secret put` and persist across deploys — the pipeline never
    # touches them.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This codebase runs as FOUR Workers off different wrangler configs,
      # sharing the same D1 + R2. Each script sets WRANGLER_CONFIG so both the
      # astro build and `wrangler deploy` target the matching config. Deploy all
      # four so a push to main updates the whole surface, not just the main site.
      - name: Deploy main site (curevanails)
        run: pnpm deploy

      - name: Deploy getready waitlist Worker
        run: pnpm deploy:getready

      - name: Deploy admin dashboard Worker
        run: pnpm deploy:admin

      - name: Deploy notify email Worker
        run: pnpm deploy:notify
